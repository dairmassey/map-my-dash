<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Step Goal</title>
<link rel="stylesheet" href="tokens.css">
<script src="theme.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font: var(--type-base);
    color: var(--foreground);
    background: var(--background);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  .phone { max-width: 430px; margin: 0 auto; min-height: 100vh; padding: 16px 16px 28px; }

  .top-row { display: flex; justify-content: space-between; align-items: center; }
  .icon-btn {
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--control-bg, var(--card));
    box-shadow: var(--control-shadow, 0 2px 10px rgba(0,0,0,.12));
    color: var(--foreground);
    cursor: pointer;
  }

  /* Title sits inside the screen gutter so it doesn't hug the edge */
  .title { padding: 24px 8px 20px; }
  .title h1 {
    font: var(--type-3xl);
    font-family: var(--font-title, var(--font));
    font-weight: var(--weight-heading, var(--weight-title, 700));
    letter-spacing: var(--tracking-title, -.01em);
  }
  /* Scoped version: SF Pro Bold at the My Performance size, tracked in slightly as SF is at display sizes */
  /* Tracking from apple.com's 28px SF Pro Display headline: 28/32 at +0.007em */
  :root[data-version="scoped"] .title h1 { font: 700 28px/32px var(--font); letter-spacing: .007em; font-kerning: normal; }
  .title p { font: var(--type-base); font-weight: var(--weight-label, 400); letter-spacing: var(--tracking-text, normal); color: var(--muted-foreground); margin-top: 2px; }

  .card { background: var(--card-fill, var(--card)); color: var(--card-foreground); border-radius: var(--radius); overflow: hidden; }
  /* Less top padding: the title's line height already adds space above the letters */
  .sec { padding: 14px 20px 20px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .card-title {
    font: var(--type-xl);
    font-family: var(--font-title, var(--font));
    font-weight: var(--weight-title, 600);
    letter-spacing: var(--tracking-title, -.01em);
  }
  :root[data-version="scoped"] .card-title { font-size: 24px; line-height: 28px; letter-spacing: .01em; font-kerning: normal; }
  :root[data-version="scoped"] .card-head { align-items: flex-start; }
  .stamp { font: var(--type-xs); color: var(--muted-foreground); }
  .label { font: var(--type-sm); font-weight: var(--weight-label, 400); letter-spacing: var(--tracking-text, normal); color: var(--label-color, var(--muted-foreground)); margin-top: 14px; }
  .value {
    font: var(--type-value, var(--type-3xl));
    font-family: var(--font-number, var(--font));
    font-weight: var(--weight-number, 500);
    letter-spacing: var(--tracking-number, -.02em);
    margin-top: 2px;
  }
  /* Units use the number face too, so the value reads as one font */
  .value small { font: var(--type-unit, var(--type-base)); font-family: var(--font-number, var(--font)); font-weight: var(--unit-weight, var(--weight-number, 500)); color: var(--unit-color, inherit); letter-spacing: 0; }

  .progress { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .track { flex: 1; height: 10px; background: var(--secondary); border-radius: 5px; overflow: hidden; }
  .track i { display: block; height: 100%; width: var(--p); background: var(--fill-progress, var(--accent)); border-radius: 5px; }
  .progress span { font: var(--type-sm); color: var(--label-color, var(--muted-foreground)); min-width: 38px; text-align: right; }

  /* Modern Health, or the scoped version: the walking figure beside the goal, drawn as a luminance mask of the
     white-on-black file so it's smooth, boxless and in the text color */
  .goal-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .walker {
    display: none;
    /* Square slot; the figure is centered in it at full height */
    width: 32px;
    height: 32px;
    flex: none;
    background: var(--card-foreground);
    mask: url(assets/figures/walk.dark.svg) center / contain no-repeat;
    mask-mode: luminance;
  }
  :root:is([data-theme="health"], [data-version="scoped"]) .walker { display: block; }

  /* Stat rows */
  .rows { list-style: none; }
  .rows li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    font: var(--type-base);
    letter-spacing: var(--tracking-text, normal);
  }
  .rows li span:first-child { color: var(--label-color, var(--muted-foreground)); font-weight: var(--weight-label, 400); }
  .rows li span:last-child { color: var(--muted-foreground); font-variant-numeric: tabular-nums; }

  /* Modern Health: grey values, rows split by hairlines inset from the left like iOS lists */
  :root[data-theme="health"] .rows li { border-top: 0; position: relative; }
  :root[data-theme="health"] .rows li::before { content: ""; position: absolute; top: 0; left: 20px; right: 0; border-top: 1px solid var(--border); opacity: .6; }
</style>
</head>
<body>
<div class="phone">
  <div class="top-row">
    <a class="icon-btn" href="goals.html" aria-label="Back"><svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 2 8l6 6"/></svg></a>
    <button class="icon-btn" type="button" aria-label="More options"><svg width="18" height="4" viewBox="0 0 18 4" fill="currentColor"><circle cx="2" cy="2" r="2"/><circle cx="9" cy="2" r="2"/><circle cx="16" cy="2" r="2"/></svg></button>
  </div>

  <div class="title">
    <h1>Weekly Step Goal</h1>
    <p>70,000 Steps</p>
  </div>

  <article class="card">
    <div class="sec">
      <div class="card-head"><h2 class="card-title">Step Count</h2><span class="stamp">6:47 AM »</span></div>
      <div class="goal-head">
        <div>
          <div class="label">Weekly Step Goal</div>
          <div class="value">23,479<small>/70,000</small></div>
        </div>
        <span class="walker" aria-hidden="true"></span>
      </div>
      <!-- 23,479 of 70,000 = 34% -->
      <div class="progress"><div class="track"><i style="--p:34%"></i></div><span>34%</span></div>
    </div>
    <ul class="rows">
      <li><span>Distance</span><span>1.34 Miles</span></li>
      <li><span>Duration</span><span>12.35 Hours</span></li>
      <li><span>Calories</span><span>12,560</span></li>
      <li><span>Weeks</span><span>2</span></li>
      <li><span>Total Distance</span><span>33.34 Miles</span></li>
      <li><span>Total Duration</span><span>55.35 Hours</span></li>
      <li><span>Total Calories</span><span>22,560</span></li>
    </ul>
  </article>
</div>
</body>
</html>
